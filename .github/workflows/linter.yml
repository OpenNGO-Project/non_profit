name: Linters

on:
  push:
    branches: [version-16]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: 'Frappe Linter'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - uses: pre-commit/action@v3.0.0

      - name: Download Semgrep rules
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        run: |
          pip install semgrep
          base_sha="${BASE_SHA:-HEAD^}"
          mapfile -t targets < <(git diff --name-only --diff-filter=ACMR "$base_sha" HEAD -- '*.py' '*.js' '*.json')
          if [ ${#targets[@]} -eq 0 ]; then
            echo "No changed Python, JavaScript, or JSON files to scan."
            exit 0
          fi
          semgrep scan --error --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness "${targets[@]}" 2>&1 | tee -a /tmp/lint.log
        env:
          # Trunk-based: there is no pull_request context any more, so this is
          # empty and the scan falls back to HEAD^ -- the commit just pushed.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}

      # This Forgejo has no Actions log API and the web log route needs a
      # browser session a token cannot produce, so a failing lint publishes its
      # own log. Without it, a red base branch can only be guessed at.
      - name: Post failure log
        if: failure()
        run: |
          U="https://code.goodvantage.cloud/api/packages/Goodvantage/generic/ci-logs/run-${RUNID}"
          curl -s -o /dev/null -u "Goodfred:${AT}" --upload-file /tmp/lint.log "$U/lint-semgrep.log" || true
        env:
          AT: ${{ secrets.CI_ARTIFACT_TOKEN }}
          RUNID: ${{ github.run_id }}

  deps-vulnerable-check:
    name: 'Vulnerable Dependency Check'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - uses: actions/checkout@v6

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/setup.py') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install and run pip-audit
        run: |
          pip install pip-audit
          cd ${GITHUB_WORKSPACE}
          pip-audit --desc on --requirement requirements.txt 2>&1 | tee -a /tmp/audit.log

      # This Forgejo has no Actions log API and the web log route needs a
      # browser session a token cannot produce, so a failing lint publishes its
      # own log. Without it, a red base branch can only be guessed at.
      - name: Post failure log
        if: failure()
        run: |
          U="https://code.goodvantage.cloud/api/packages/Goodvantage/generic/ci-logs/run-${RUNID}"
          curl -s -o /dev/null -u "Goodfred:${AT}" --upload-file /tmp/audit.log "$U/lint-pip-audit.log" || true
        env:
          AT: ${{ secrets.CI_ARTIFACT_TOKEN }}
          RUNID: ${{ github.run_id }}
