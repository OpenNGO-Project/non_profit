name: CI

on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # Forgejo act_runner: jobs run inside containers, so services are reached
    # by hostname (mariadb:3306, redis-cache:6379), not host port mappings.
    services:
      redis-cache:
        image: redis:alpine
      redis-queue:
        image: redis:alpine
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          check-latest: true

      - name: System dependencies and CI user
        run: |
          apt-get update -qq
          # cron: bench init aborts without /usr/bin/crontab.
          apt-get install -y -qq git curl ca-certificates cron mariadb-client >/dev/null
          npm install -g yarn >/dev/null
          # bench refuses to run as root; job containers run as root.
          useradd -m -s /bin/bash runner
          chown -R runner "$GITHUB_WORKSPACE"

      - name: Setup bench
        run: |
          set -o pipefail
          pip install -q frappe-bench
          touch /tmp/ci.log && chmod 666 /tmp/ci.log
          sudo -u runner -H env "PATH=$PATH" "TOKEN=$TOKEN" bash -c '
            set -e
            git config --global url."https://x-access-token:${TOKEN}@code.goodvantage.cloud/".insteadOf "https://code.goodvantage.cloud/"
            cd /home/runner
            bench init --skip-redis-config-generation --skip-assets --frappe-branch version-16 --python "$(which python)" /home/runner/frappe-bench
            cd /home/runner/frappe-bench
            bench set-config -g redis_cache redis://redis-cache:6379
            bench set-config -g redis_queue redis://redis-queue:6379
            bench set-config -g redis_socketio redis://redis-queue:6379
          ' 2>&1 | tee -a /tmp/ci.log
        env:
          TOKEN: ${{ secrets.CI_FORGEJO_TOKEN }}

      - name: Get apps
        run: |
          set -o pipefail
          sudo -u runner -H env "PATH=$PATH" "WS=$GITHUB_WORKSPACE" bash -c '
            set -e
            cd /home/runner/frappe-bench
            bench get-app erpnext --branch version-16
            bench get-app payments --branch version-16
            bench get-app non_profit "$WS"
            bench setup requirements --dev
          ' 2>&1 | tee -a /tmp/ci.log
        env:
          CI: 'Yes'

      - name: Site setup and install apps
        run: |
          set -o pipefail
          sudo -u runner -H env "PATH=$PATH" bash -c '
            set -e
            cd /home/runner/frappe-bench
            # frappe logger wants <bench>/test_site/logs before the site exists
            mkdir -p ~/logs logs test_site/logs
            bench new-site --db-host mariadb --db-root-password root --admin-password admin test_site
            mkdir -p sites/test_site/logs
            # frappe throttles User creation at 60/hour in production; every
            # upstream Frappe app raises this for CI (see erpnext, hrms,
            # payments, non_profit .github/helper/site_config.json).
            bench --site test_site set-config -p throttle_user_limit 1000
            bench --site test_site install-app erpnext
            bench --site test_site install-app payments
            bench --site test_site install-app non_profit
            # Do not run the ERPNext setup wizard here. This app owns a
            # before_tests hook that sets the site up itself, and it only does
            # so when no Company exists. A wizard-built site therefore skips
            # that hook and still carries the wizard Price List "Standard
            # Buying", which collides on the primary key with the ERPNext test
            # record of the same name as soon as any suite pulls it in.
            # good_pm CI is green on exactly this wizard-less shape.
            bench build
          ' 2>&1 | tee -a /tmp/ci.log
        env:
          CI: 'Yes'

      - name: Run Tests
        run: |
          set -o pipefail
          sudo -u runner -H env "PATH=$PATH" bash -c '
            set -e
            cd /home/runner/frappe-bench
            bench --site test_site set-config allow_tests true
            bench --site test_site run-tests --app non_profit --coverage
          ' 2>&1 | tee -a /tmp/ci.log
        env:
          TYPE: server

      # This Forgejo exposes no Actions log API and its web log route needs a
      # browser session, so a failing run publishes its own log. Upload the
      # whole thing to the package registry and open the tail as an issue: this
      # suite runs in three batches, and a tail alone showed only the last one
      # -- which passed -- while sixteen errors in the middle batch scrolled
      # past the window and the failure looked undiagnosable.
      - name: Post failure log
        if: failure()
        run: |
          U="https://code.goodvantage.cloud/api/packages/Goodvantage/generic/ci-logs/run-${RUNID}"
          curl -s -o /dev/null -u "Goodfred:${AT}" --upload-file /tmp/ci.log "$U/ci.log" || true
          export TAIL=$(tail -c 12000 /tmp/ci.log 2>/dev/null || echo "no captured log")
          python3 - <<'PYEOF'
          import os, json, urllib.request
          fence = chr(96) * 3
          body = "Run %s\n\n%s\n%s\n%s" % (os.environ.get('RUNID', '?'), fence, os.environ.get('TAIL', ''), fence)
          payload = json.dumps({'title': 'CI failure log: non_profit', 'body': body}).encode()
          req = urllib.request.Request(os.environ['API'] + '/repos/Goodvantage/non_profit/issues',
                data=payload, method='POST',
                headers={'Content-Type': 'application/json', 'Authorization': 'token ' + os.environ['GT']})
          urllib.request.urlopen(req, timeout=30)
          PYEOF
        env:
          GT: ${{ secrets.GITHUB_TOKEN }}
          AT: ${{ secrets.CI_ARTIFACT_TOKEN }}
          API: ${{ github.api_url }}
          RUNID: ${{ github.run_id }}
